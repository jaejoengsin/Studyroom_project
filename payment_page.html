<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결제 페이지</title>
  <link rel="stylesheet" href="assets/css/font_style.css">
  <!--css link -->
  <link rel="stylesheet" href="assets/css/bass.css" type="text/css">
  <link rel="stylesheet" href="assets/css/layout.css" type="text/css">
  <link rel="stylesheet" href="assets/css/components/comon.css" type="text/css">
  <link rel="stylesheet" href="assets/css/components/payment_page.css" type="text/css">
  <link rel="stylesheet" href="assets/css/theme.css" type="text/css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="assets/scripts/hamburgerMenu.js"></script>
  <script src="assets/scripts/time_theme.js"></script>
</head>

<body>
  <!-- 로그인 버튼 -->
  <a id="loginBtn" class="login-btn" href="login.html">log in</a>

  <!-- 헤더 -->
  <header>
    <div class="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <div class="logo">
      <img src="assets/images/icon2.png" alt="icon" id="logo">
    </div>
    <nav class="navbar">
      <a href="main.html">홈</a>
      <a href="introduction.html">이용안내</a>
      <a href="service.html">고객지원</a>
      <a href="inform_rout.html">오시는길</a>
    </nav>
  </header>
  <main>
    <div>
      <div class="information-box">
        <h2 class="payment-main-title">결제하기</h2>
        <h2 class="payment-title">예약자 정보</h2>
        <section class="payment-info">
          <form>
            <ul>
              <li><label for="name">성함</label>
                <input id="name" type="text" name="name" required>
              </li>
              <li><label for="acount">연락처</label>
                <input id="acount" type="text" name="account" required>
              </li>
              <li><label for="mail">이메일</label>
                <input id="email" type="text" name="email" required>
              </li>
              <li><label for="purpose">사용 목적</label>
                <input id="purpose" type="text" name="purpose">
              </li>
          </form>
        </section>
        <h2 class="payment-title">결제 정보</h2>
        <section class="payment-info">
          <form>
            <ul>

              <li><label>예약 날짜</label><span id="date"></span></li>
              <li><label>room</label><span id="studyRoom"></span></li>
              <li><label>시간</label><span id="time"></span></li>
              <li><label>인원</label><span id="people"></span></li>
              <li><label>결제 금액</label><span id="total-price"></span></li>
          </form>
        </section>

        <h2 class="payment-title">결제 수단</h2>
        <section class="pay-method">
          <ul>
            <li><input id="naver" name="payment" type="radio" value="네이버 페이"><label for="naver">네이버 페이</label></li>
            <li><input id="kakao" name="payment" type="radio" value="카카오 페이"><label for="kakao">카카오 페이</label></li>
            <li><input id="card" name="payment" type="radio" value="신용/체크카드"><label for="card">신용/체크카드</label></li>
            <li><input id="phone" name="payment" type="radio" value="핸드폰 결제"><label for="phone">핸드폰 결제</label></li>
            <li><input id="bank" name="payment" type="radio" value="무통장 입금"><label for="bank">무통장 입금</label></li>
          </ul>
        </section>
        <section class="pay">
          <button id="complete_paymentLinkButton">결제하기</button>
        </section>
      </div>
    </div>
  </main>

  <!-- 푸터 영역 -->
  <footer>
    <div class="policy">
      <ul></ul>
      <p class="address">
        경기대 수원캠퍼스 웹프 스터디룸<br>
        사업자명 : <br>
        사업자등록번호 : <br>
        개인정보보호관리 : k<br>
      </p>
    </div>
    <div class="shopinfo">
      <dl>
        <dt>모임공간 운영시간 :</dt>
        <dd><strong>365일 24시간</strong> 이용가능</dd>
      </dl>
      <dl>
        <dt>예약상담시간 :</dt>
        <dd>평일&amp;토요일 10시~22시 (일요일 10시~20시)</dd>
      </dl>
    </div>
  </footer>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginBtn = document.getElementById('loginBtn');
      if (!loginBtn) return; // 로그인 버튼이 없는 페이지엔 실행 안함

      const isLoggedIn = localStorage.getItem('isLoggedIn');

      if (isLoggedIn === 'true') {
        loginBtn.textContent = 'log out';
        loginBtn.href = '#';
        loginBtn.style.cursor = 'pointer';

        // 기존에 이벤트 중복 방지 위해 먼저 이벤트 리스너 제거 후 추가 (optional)
        loginBtn.replaceWith(loginBtn.cloneNode(true));
        const newLoginBtn = document.getElementById('loginBtn') || document.querySelector('.login-btn');

        newLoginBtn.addEventListener('click', (e) => {
          e.preventDefault();
          localStorage.removeItem('isLoggedIn');
          alert('로그아웃 되었습니다.');
          location.reload(); // 새로고침하여 상태 갱신
        });
      } else {
        loginBtn.textContent = 'log in';
        loginBtn.href = 'login.html';
        loginBtn.style.cursor = 'pointer';
      }
    });

    const userData = {};
    function saveUserData() {

      userData["name"] = document.getElementById("name").value;
      userData["acount"] = document.getElementById("acount").value;
      userData["email"] = document.getElementById("email").value;
      userData["purpose"] = document.getElementById("purpose").value;
      userData["payment"] = document.querySelector('input[name="payment"]:checked').value;
      for (const key in userData) {
        console.log(userData[key]);
        if (userData[key] == "") {
          alert(`${key}가 입력되지 않았습니다`);
          return;
        }
      }
      localStorage.setItem("userData", JSON.stringify(userData));
      window.location.href = "complete_payment_page.html";
    }

    window.onload = function () {
      const useReserdataStr = localStorage.getItem("userReservationData");
      if (useReserdataStr != null) {
        const useReserdata = JSON.parse(useReserdataStr);
        document.getElementById("date").textContent = useReserdata["date"];
        document.getElementById("time").textContent = useReserdata["time"];
        document.getElementById("studyRoom").textContent = useReserdata["studyRoom"];
        document.getElementById("people").textContent = useReserdata["people"];
        document.getElementById("total-price").textContent = useReserdata["totalPrice"];

      }
      else {
        alert("예약을 먼저 해주세요");
      }
    }

    let complete_paymentLinkButton = document.getElementById("complete_paymentLinkButton");
    complete_paymentLinkButton.addEventListener('click', () => saveUserData());
    // 페이지 로드 시 테마 적용
    updateTheme();

    // 1시간마다 테마 업데이트
    setInterval(updateTheme, 60 * 60 * 1000);

  </script>



</body>

</html>
