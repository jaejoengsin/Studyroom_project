<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>payment_page</title>
    <link rel="stylesheet" href="assets/css/font_style.css">
     <!--css link -->
  <link rel="stylesheet" href="assets/css/bass.css" type="text/css">
  <link rel="stylesheet" href="assets/css/layout.css" type="text/css">
  <link rel="stylesheet" href="assets/css/components/comon.css" type="text/css">
  <link rel="stylesheet" href="assets/css/components/payment_page.css" type="text/css">
  <link rel="stylesheet" href="assets/css/theme.css" type="text/css">
</head>
<body>
     <!-- 로그인 버튼 -->
  <a class="login-btn" href="login.html">log in</a>

  <!-- 헤더 -->
  <header>
    <img class="logo" src="icon2.png" alt="icon">
    <nav class="navbar">
      <a href="main.html">홈</a>
      <a href="introduction.html">이용안내</a>
      <a href="service.html">고객지원</a>
      <a href="inform_rout.html">오시는길</a>
    </nav>
  </header>

        <!-- 메인 콘텐츠 영역 -->
        <main>
            <div class="information-box">
            <h2 class="payment-main-title">결제하기</h2>
            <h2 class="payment-title">예약자 정보</h2>
            <section class="payment-info">
                <!--fieldset 추가?-->
                <!--table 태그는 안씀 -> 반응형 디자인 css 적용에 불리-->
                <form>
                    <ul>
                    <li><label for="name">성함</label>
                        <input id="name" type="text" name="name" required></li>
                    <li><label for="account">연락처</label>
                        <input id="account" type="text" name="account" required></li>
                    <li><label for="mail">이메일</label>
                        <input id="mail" type="text" name="mail" required></li>
                    <li><label for="purpose">사용 목적</label>
                        <input id="purpose" type="text" name="purpose" ></li>
                </form>
            </section>
            <h2 class="payment-title">결제 정보</h2>
            <section class="payment-info">
                <form>
                    <ul>
                    <!--예약 페이지에서 입력한 데이터를 가져올 것 같음(아마 자바스크립트로?)-->
                    <li><label>예약 날짜</label><span id="#">| 2025-05-02</span></li>
                    <li><label>room</label><span id="#">| 605호</span></li>
                    <li><label>시간</label><span id="#">| 00:30 ~ 02:30</span></li>
                    <li><label>인원</label><span id="#">| 5명</span></li>
                    <li><label>결제 금액</label><span id="#">| 10,000원</span></li>
                </form>
            </section>
            <!--포인트(혹은 쿠폰...?) 사용 페이지 가능하면 추가-->
            <h2 class="payment-title">결제 수단</h2>
            <section class="pay-method">
                <form>
                    <ul class="pay-method">
                        <li><label for="naver"><input id="naver" type="radio" name="pay_method"></label></li>
                        <li><label for="kakao"><input id="kakao" type="radio" name="pay_method"></label></li>
                        <li><label for="card"><input id="card" type="radio" name="pay_method"></label></li>
                        <li><label for="phone"><input id="phone" type="radio" name="pay_method"></label></li>
                        <li><label for="bankbook"><input id="bankbook" type="radio" name="pay_method"></label></li>
                    </ul>

                </form>
            </section>
            <section class="conditions">
                <div class="conditions">
                <h3>이용안내 및 약관</h3>
                <p>안내 내용</p>
                <input id="checkbox" type="checkbox"><label for="checkbox">동의</label><!--버튼을 눌러 동의를 구하는 것까지 (구현은 가능하지만)필요한지 모르겠음-->
                </div>
            </section>
            <section class="pay">
                <div class="pay">
                    <!--결제하기 옆에 "데이터 금액 추가"기능 나중에 구현-->
                    <!--자바스크립트로 추가 작업을 할 수도 있을지도 몰라서 일단 button으로 구현(onclick이 버튼 누르면 자바스크립트 처리 후 입력한 페이지로 이동)
                    아니라면, <a>로 변경할수도...-->
                    <button type="submit" onclick="location.href='complete_payment_page.html'"><span id="acount"></span>결제하기</button>
                </div>
            </section>
        </div>
        </main>
    
        <!-- 푸터 영역 -->
        <footer>
            <div class="policy">
              <ul></ul>
              <p class="address">
                경기대 수원캠퍼스 웹프 스터디룸<br>
                사업자명 : <br>
                사업자등록번호 : <br>
                개인정보보호관리 : k<br>    
              </p>
            </div>
            <div class="shopinfo">
              <dl>
                <dt>모임공간 운영시간 :</dt>
                <dd><strong>365일 24시간</strong> 이용가능</dd>
              </dl>
              <dl>
                <dt>예약상담시간 :</dt>
                <dd>평일&amp;토요일 10시~22시 (일요일 10시~20시)</dd>
              </dl>
            </div>
          </footer>
        

</body>
</html>
