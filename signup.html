    <link rel="stylesheet" href="assets/css/layout.css" type="text/css">
    <link rel="stylesheet" href="assets/css/components/comon.css" type="text/css">
    <link rel="stylesheet" href="assets/css/components/signup.css" type="text/css">
    <link rel="stylesheet" href="assets/css/theme.css" type="text/css">

</head>


<body>
         <!-- 로그인 버튼 -->
  <a class="login-btn" href="login.html">log in</a>

  <!-- 헤더 -->
  <header>
    <div class="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <div class="logo">
       <img src="assets/images/icon2.png" alt="icon" id="logo">
    </div>
    <nav class="navbar">
      <a href="main.html">홈</a>
      <a href="introduction.html">이용안내</a>
      <a href="service.html">고객지원</a>
      <a href="inform_rout.html">오시는길</a>
    </nav>
  </header>

    <section class="accession-box">
        <h2>회원가입</h2>
        <h3>회원정보 입력</h3>
        <ul>
            <li><span>이름</span><input id="name" type="text"></li>
            <li><span>id</span><input id="id" type="text"></li>
            <li><span>비밀번호</span><input id="password" type="text"></li>
            <li><span>전화번호</span><input id="phone" type="text"></li>
            <li><span>생년월일</span><input id="birth" type="text"></li>
        </ul>
        <div class="access-button" >
          <button id="completeAccessionBotton">가입하기</button>
        </div>
    </section>

     <!-- 푸터 영역 -->
        <footer>
            <div class="policy">
              <ul></ul>
              <p class="address">
                경기대 수원캠퍼스 웹프 스터디룸<br>
                사업자명 : <br>
                사업자등록번호 : <br>
                개인정보보호관리 : k<br>    
              </p>
            </div>
            <div class="shopinfo">
              <dl>
                <dt>모임공간 운영시간 :</dt>
                <dd><strong>365일 24시간</strong> 이용가능</dd>
              </dl>
              <dl>
                <dt>예약상담시간 :</dt>
                <dd>평일&amp;토요일 10시~22시 (일요일 10시~20시)</dd>
              </dl>
            </div>
          </footer>

          <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>

          <script>

            $(document).ready(function() {
              if (!localStorage.getItem("joinData")) {
                const joinData = {};
                localStorage.setItem("joinData", JSON.stringify(joinData));
                console.log("객체 생성 완료");
              } else {
                console.log("객체 이미 존재함");
              }
            });

             function Fnext () {
              const joinUser = {};
              joinUser["name"] = $("#name").val();
              joinUser["id"] = $("#id").val();
              joinUser["password"] = $("#password").val();
              joinUser["phone"] = $("#phone").val();
              joinUser["birth"] = $("#birth").val();
              for (const key in joinUser) {
                if(joinUser[key]=="") {
                  alert(`${key}가 입력되지 않았습니다`);
                  return;
                }
              }

              const joinData = JSON.parse(localStorage.getItem("joinData"));
              joinData[`${Object.keys(joinData).length}`] = joinUser;
              localStorage.setItem("joinData",JSON.stringify(joinData));
              alert("회원가입이 완료되었습니다!")
              window.location.href="main.html";
             }

            $("#completeAccessionBotton").on("click", Fnext);

               // 페이지 로드 시 테마 적용
          updateTheme();

          // 1시간마다 테마 업데이트
          setInterval(updateTheme, 60 * 60 * 1000);

          </script>

</body>

</html>
