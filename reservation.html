<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스터디룸 예약페이지</title>
  <!--css link -->
  <link rel="stylesheet" href="assets/css/bass.css" type="text/css">
  <link rel="stylesheet" href="assets/css/layout.css" type="text/css">
  <link rel="stylesheet" href="assets/css/components/comon.css" type="text/css">
  <link rel="stylesheet" href="assets/css/components/reservation.css" type="text/css">
  <link rel="stylesheet" href="assets/css/theme.css" type="text/css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="assets/scripts/hamburgerMenu.js"></script>
  <script src="assets/scripts/time_theme.js"></script>
</head>

<body>

  <a class="login-btn" href="login.html">log in</a>

  <header>
    <div class="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <div class="logo">
      <img src="assets/images/icon2.png" alt="icon" id="logo">
    </div>
    <nav class="navbar">
      <a href="main.html">홈</a>
      <a href="introduction.html">이용안내</a>
      <a href="service.html">고객지원</a>
      <a href="inform_rout.html">오시는길</a>
    </nav>
  </header>

  <main>
    <div class="information-box">
      <h2>예약하기</h2>

      <div class="section">
        <label for="date">날짜 선택:</label>
        <input type="date" id="date" onchange="updateSelectedDate()">
      </div>

      <div class="section">
        <h3>시간 선택 (2시간 단위)</h3>
        <div class="time-container" id="timeContainer"></div>
      </div>

      <div class="section">
        <h3>스터디룸 선택</h3>
        <label for="studyroom">스터디룸 선택:</label>
        <select id="studyroom" onchange="updateSelectedStudyRoom()">
          <option value="">스터디룸 선택</option>
          <option value="601호">601호</option>
          <option value="602호">602호</option>
          <option value="603호">603호</option>
          <option value="604호">604호</option>
          <option value="605호">605호</option>
          <option value="606호">606호</option>
          <option value="607호">607호</option>
          <option value="608호">608호</option>
        </select>
      </div>
      <hr>
      <div class="section">
        <h3>선택한 예약 정보</h3>
        <p>선택한 날짜: <span id="selected-date"></span></p>
        <p>선택한 시간: <span id="selected-time"></span></p>
        <p>선택한 스터디룸: <span id="selected-studyroom"></span></p>
      </div>

      <div class="section">
        <label for="people">인원 선택:
          <input type="number" id="people" value="1" min="1" max="10" onchange="updateTotalPrice()"></label>
      </div>

      <div class="section">
        <p>총 금액: <span id="total-price"></span>원</p>
      </div>

      <!-- <button onclick="location.href='payment_page.html'">예약하기</button> -->
      <button id="paymentLinkButton">예약하기</button>

    </div>
  </main>

  <footer>
    <div class="policy">
      <p class="address">
        스터디룸 : Insight Room<br>
        사업자명 : 최재정, 박예원<br>
        사업자등록번호 : 202015497-202311694<br>
      </p>
    </div>
    <div class="shopinfo">
      <dl>
        <dt>모임공간 운영시간 :</dt>
        <dd><strong>365일 24시간</strong> 이용가능</dd>
      </dl>
      <dl>
        <dt>예약상담시간 :</dt>
        <dd>평일&토요일 10시~22시 (일요일 10시~20시)</dd>
      </dl>
    </div>
  </footer>

  <script>

    // 예약 기능
    const timeContainer = document.getElementById("timeContainer");
    const selectedTimeSpan = document.getElementById("selected-time");
    const selectedDateSpan = document.getElementById("selected-date");
    const totalPriceSpan = document.getElementById("total-price");
    const peopleInput = document.getElementById("people");
    let selectedTime = null;
    const basePrice = 5000;


    function generateTimeSlots() {
      for (let hour = 0; hour < 24; hour++) {
        for (let min = 0; min < 60; min += 30) {
          const startTime = `${hour.toString().padStart(2, '0')}:${min.toString().padStart(2, '0')}`;
          const slot = document.createElement("div");
          slot.classList.add("time-slot");
          slot.textContent = startTime;
          slot.dataset.time = startTime;
          slot.onclick = () => selectTime(slot);
          timeContainer.appendChild(slot);
        }
      }
    }

    function selectTime(slot) {
      document.querySelectorAll(".time-slot").forEach(el => el.classList.remove("selected-time"));
      let startTime = slot.dataset.time;
      let [hour, min] = startTime.split(":").map(Number);
      let endHour = (hour + 2) % 24;
      let endTime = `${endHour.toString().padStart(2, '0')}:${min.toString().padStart(2, '0')}`;

      selectedTime = `${startTime} ~ ${endTime}`;
      selectedTimeSpan.textContent = selectedTime;
      slot.classList.add("selected-time");
      updateTotalPrice();
    }

    function updateSelectedDate() {
      selectedDateSpan.textContent = document.getElementById("date").value;
    }

    function updateSelectedStudyRoom() {
      const studyroomSelect = document.getElementById("studyroom");
      const selectedRoom = studyroomSelect.value;
      document.getElementById("selected-studyroom").textContent = selectedRoom || "-";
    }

    function updateTotalPrice() {
      const peopleCount = parseInt(peopleInput.value) || 1;
      totalPriceSpan.textContent = (basePrice * peopleCount).toLocaleString();
    }
    generateTimeSlots();
    const userReservationData = {};
    
    /*결제 페이지와 연동을 위해 제가 일단 추가했습니다.*/
    function saveData () {
     
      /*맨 위에 작성한 선언 및 초기화 코드를 사용 가능하나 일단 따로 작성하였습니다*/
     userReservationData["date"]=document.getElementById("selected-date").textContent; 
     userReservationData["time"]=document.getElementById("selected-time").textContent; 
     userReservationData["studyRoom"]=document.getElementById("selected-studyroom").textContent; 
     userReservationData["people"]=document.getElementById("people").value; 
     userReservationData["totalPrice"]=document.getElementById("total-price").textContent; 
     for (const key in userReservationData) {
      console.log(userReservationData[key]);
       if(userReservationData[key]=="") {
        alert(`${key}가 입력되지 않았습니다`);
        return;
       }
     }
     localStorage.setItem("userReservationData",JSON.stringify(userReservationData));
     window.location.href="payment_page.html";
    }
 
    let paymentLinkButton = document.getElementById("paymentLinkButton");
    paymentLinkButton.addEventListener('click', () => saveData());
    /*여기까지*/

  // 페이지 로드 시 테마 적용
    updateTheme();

    // 1시간마다 테마 업데이트
    setInterval(updateTheme, 60 * 60 * 1000);

  </script>

</body>

</html>
