<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>웹프 스터디룸 예약</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      line-height: 1.6;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* 로그인 버튼 */
    .login-btn {
      position: fixed;
      top: 10px;
      right: 20px;
      font-size: 16px;
      text-decoration: none;
      color: #305070;
      background: none;
      border: none;
      z-index: 1001;
    }

    /* 헤더 전체 */
    header {
      background-color: #fff5eb;
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
      text-align: center;
      padding-top: 10px;
      transition: background-color 0.3s ease;
    }

    /* 로고 이미지 */
    .logo {
      width: 160px;
      height: auto;
      margin: 0 auto;
    }

    /* 네비게이션 바 - 플렉스 레이아웃 */
    nav.navbar {
      background-color: #305070;
      color: #fff5eb;
      padding: 10px 0;
      display: flex;
      justify-content: center; /* 중앙 정렬 */
      align-items: center;
      transition: background-color 0.3s ease;
    }

    nav.navbar a {
      margin: 0 30px;
      text-decoration: none;
      font-weight: bold;
      color: #fff5eb;
      transition: color 0.3s, text-decoration 0.3s;
    }

    nav.navbar a:hover {
      color: #ffeb3b; /* 마우스 오버 시 노란색 */
      text-decoration: underline;
    }


    /* 본문 */
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
      transition: background-color 0.3s ease;
    }

    /* 시간 선택 */
    .time-container {
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      border: 1px solid #ccc;
      padding: 10px;
    }

    .time-slot {
      display: inline-block;
      padding: 10px;
      margin: 5px;
      border: 1px solid #000;
      cursor: pointer;
      min-width: 60px;
      text-align: center;
    }

    .selected-time {
      background-color: #4CAF50;
      color: white;
    }

    /* 푸터 */
    footer {
      background-color: #f1f1f1;
      padding: 40px 20px;
      font-size: 16px;
    }

    footer .policy,
    footer .shopinfo {
      max-width: 1000px;
      margin: 0 auto;
    }

    footer .address {
      margin-top: 10px;
    }

    footer dl {
      margin: 10px 0;
    }

    /* 낮 시간 테마 (아이보리/화사한 테마) */
    .daytime {
      background-color: #fff5eb;
      color: #305070;
    }

    .daytime header {
      background-color: #fff5eb;
    }

    .daytime nav.navbar {
      background-color: #305070;
    }

    .daytime footer {
      background-color: #f1f1f1;
      color: #305070;
    }

    /* 밤 시간 테마 (남색/회색 테마) */
    .nighttime {
      background-color: #2f3b4c;
      color: #e0e0e0;
    }

    .nighttime header {
      background-color: #3a4d64;
    }

    .nighttime nav.navbar {
      background-color: #2f3b4c;
    }

    .nighttime footer {
      background-color: #212b34;
      color: #e0e0e0;
    }

  </style>
</head>
<body>

<!-- 로그인 버튼 -->
<a class="login-btn" href="login.html">log in</a>

<!-- 헤더 -->
<header>
  <img class="logo" src="icon2.png" alt="icon">
  <nav class="navbar">
    <a href="#">홈</a>
    <a href="#">이용안내</a>
    <a href="#">고객지원</a>
    <a href="#">오시는길</a>
  </nav>
</header>

  <!-- 메인 콘텐츠 -->
  <main>
    <section>
      <h2>예약하기</h2>

      <!-- 날짜 선택 -->
      <label for="date">날짜 선택:</label>
      <input type="date" id="date" onchange="updateSelectedDate()">

      <!-- 시간 선택 바 -->
      <h3>시간 선택 (2시간 단위)</h3>
      <div class="time-container" id="timeContainer"></div>

      <!-- 선택한 정보 표시 -->
      <h3>선택한 예약 정보</h3>
      <p>선택한 날짜: <span id="selected-date">-</span></p>
      <p>선택한 시간: <span id="selected-time">-</span></p>

      <!-- 인원 선택 -->
      <label for="people">인원 선택:</label>
      <input type="number" id="people" value="1" min="1" max="10" onchange="updateTotalPrice()">

      <!-- 총 금액 계산 -->
      <p>총 금액: <span id="total-price">5000</span>원</p>

      <!-- 예약 버튼 -->
      <button onclick="location.href='payment.html'">예약하기</button>
    </section>
  </main>

  <!-- 푸터 -->
  <footer>
    <div class="policy">
      <ul></ul>
      <p class="address">
        경기대 수원캠퍼스 웹프 스터디룸<br>
        사업자명 : <br>
        사업자등록번호 : <br>
        개인정보보호관리 : k
      </p>
    </div>
    <div class="shopinfo">
      <dl>
        <dt>모임공간 운영시간 : </dt>
        <dd><strong>365일 24시간</strong> 이용가능</dd>
      </dl>
      <dl>
        <dt>예약상담시간 : </dt>
        <dd>평일&토요일 10시~22시 (일요일 10시~20시)</dd>
      </dl>
    </div>
  </footer>

  <!-- 스크립트 -->
  <script>
    // 시간대별 테마 변경
    function updateTheme() {
      const now = new Date();
      const hour = now.getHours();
      const isDaytime = hour >= 6 && hour < 18; // 일출 6시부터 일몰 18시까지 낮

      if (isDaytime) {
        document.body.classList.add('daytime');
        document.body.classList.remove('nighttime');
      } else {
        document.body.classList.add('nighttime');
        document.body.classList.remove('daytime');
      }
    }

    // 페이지 로드 시 테마 적용
    updateTheme();

    // 1시간마다 테마 업데이트
    setInterval(updateTheme, 60 * 60 * 1000);

    // 예약 관련 기능
    const timeContainer = document.getElementById("timeContainer");
    const selectedTimeSpan = document.getElementById("selected-time");
    const selectedDateSpan = document.getElementById("selected-date");
    const totalPriceSpan = document.getElementById("total-price");
    const peopleInput = document.getElementById("people");
    let selectedTime = null;
    const basePrice = 5000;

    function generateTimeSlots() {
      for (let hour = 0; hour < 24; hour++) {
        for (let min = 0; min < 60; min += 30) {
          const startTime = `${hour.toString().padStart(2, '0')}:${min.toString().padStart(2, '0')}`;
          const slot = document.createElement("div");
          slot.classList.add("time-slot");
          slot.textContent = startTime;
          slot.dataset.time = startTime;
          slot.onclick = () => selectTime(slot);
          timeContainer.appendChild(slot);
        }
      }
    }

    function selectTime(slot) {
      const allSlots = document.querySelectorAll(".time-slot");
      allSlots.forEach(el => el.classList.remove("selected-time"));

      let startTime = slot.dataset.time;
      let [hour, min] = startTime.split(":").map(Number);
      let endHour = hour + 2;
      let endMin = min;
      if (endHour >= 24) endHour -= 24;
      let endTime = `${endHour.toString().padStart(2, '0')}:${endMin.toString().padStart(2, '0')}`;

      selectedTime = `${startTime} ~ ${endTime}`;
      selectedTimeSpan.textContent = selectedTime;
      slot.classList.add("selected-time");
      updateTotalPrice();
    }

    function updateSelectedDate() {
      selectedDateSpan.textContent = document.getElementById("date").value;
    }

    function updateTotalPrice() {
      const peopleCount = parseInt(peopleInput.value) || 1;
      totalPriceSpan.textContent = (basePrice * peopleCount).toLocaleString();
    }

    generateTimeSlots();
  </script>
</body>
</html>
