<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>웹프 스터디룸 예약</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }

    /* 헤더 */
    header {
      background-color: #f4f4f4;
      padding: 20px 0;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    .login-btn {
      position: absolute;
      right: 20px;
      top: 28px;
      padding: 8px 16px;
      border: 1px solid #333;
      border-radius: 4px;
      text-decoration: none;
      font-size: 14px;
    }

    nav.navbar {
      background-color: #ddd;
      padding: 10px 0;
      text-align: center;
    }

    nav.navbar a {
      margin: 0 30px;
      text-decoration: none;
      font-weight: bold;
      color: #000;
    }

    /* 메인 콘텐츠 */
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .time-container {
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      border: 1px solid #ccc;
      padding: 10px;
    }

    .time-slot {
      display: inline-block;
      padding: 10px;
      margin: 5px;
      border: 1px solid #000;
      cursor: pointer;
      min-width: 60px;
      text-align: center;
    }

    .selected-time {
      background-color: #4CAF50;
      color: white;
    }

    /* 푸터 */
    footer {
      background-color: #f1f1f1;
      padding: 40px 20px;
      font-size: 16px;
    }

    footer .policy,
    footer .shopinfo {
      max-width: 1000px;
      margin: 0 auto;
    }

    footer .address {
      margin-top: 10px;
    }

    footer dl {
      margin: 10px 0;
    }
  </style>
</head>
<body>

  <!-- 헤더 -->
  <header>
    <h1>웹프스터디룸</h1>
    <a class="login-btn" href="login.html">로그인</a>
  </header>

  <!-- 네비게이션 바 -->
  <nav class="navbar">
    <a href="index.html">홈</a>
    <a href="guide.html">이용안내</a>
    <a href="support.html">고객지원</a>
    <a href="location.html">오시는길</a>
  </nav>

  <!-- 메인 콘텐츠 -->
  <main>
    <section>
      <h2>예약하기</h2>

      <!-- 날짜 선택 -->
      <label for="date">날짜 선택:</label>
      <input type="date" id="date" onchange="updateSelectedDate()">

      <!-- 시간 선택 바 -->
      <h3>시간 선택 (2시간 단위)</h3>
      <div class="time-container" id="timeContainer"></div>

      <!-- 선택한 정보 표시 -->
      <h3>선택한 예약 정보</h3>
      <p>선택한 날짜: <span id="selected-date">-</span></p>
      <p>선택한 시간: <span id="selected-time">-</span></p>

      <!-- 인원 선택 -->
      <label for="people">인원 선택:</label>
      <input type="number" id="people" value="1" min="1" max="10" onchange="updateTotalPrice()">

      <!-- 총 금액 계산 -->
      <p>총 금액: <span id="total-price">5000</span>원</p>

      <!-- 예약 버튼 -->
      <button onclick="location.href='payment.html'">예약하기</button>
    </section>
  </main>

  <!-- 푸터 -->
  <footer>
    <div class="policy">
      <ul></ul>
      <p class="address">
        경기대 수원캠퍼스 웹프 스터디룸<br>
        사업자명 : <br>
        사업자등록번호 : <br>
        개인정보보호관리 : k
      </p>
    </div>
    <div class="shopinfo">
      <dl>
        <dt>모임공간 운영시간 : </dt>
        <dd><strong>365일 24시간</strong> 이용가능</dd>
      </dl>
      <dl>
        <dt>예약상담시간 : </dt>
        <dd>평일&amp;토요일 10시~22시 (일요일 10시~20시)</dd>
      </dl>
    </div>
  </footer>

  <!-- 스크립트 -->
  <script>
    const timeContainer = document.getElementById("timeContainer");
    const selectedTimeSpan = document.getElementById("selected-time");
    const selectedDateSpan = document.getElementById("selected-date");
    const totalPriceSpan = document.getElementById("total-price");
    const peopleInput = document.getElementById("people");
    let selectedTime = null;
    const basePrice = 5000;

    function generateTimeSlots() {
      for (let hour = 0; hour < 24; hour++) {
        for (let min = 0; min < 60; min += 30) {
          const startTime = `${hour.toString().padStart(2, '0')}:${min.toString().padStart(2, '0')}`;
          const slot = document.createElement("div");
          slot.classList.add("time-slot");
          slot.textContent = startTime;
          slot.dataset.time = startTime;
          slot.onclick = () => selectTime(slot);
          timeContainer.appendChild(slot);
        }
      }
    }

    function selectTime(slot) {
      const allSlots = document.querySelectorAll(".time-slot");
      allSlots.forEach(el => el.classList.remove("selected-time"));

      let startTime = slot.dataset.time;
      let [hour, min] = startTime.split(":").map(Number);
      let endHour = hour + 2;
      let endMin = min;
      if (endHour >= 24) endHour -= 24;
      let endTime = `${endHour.toString().padStart(2, '0')}:${endMin.toString().padStart(2, '0')}`;

      selectedTime = `${startTime} ~ ${endTime}`;
      selectedTimeSpan.textContent = selectedTime;
      slot.classList.add("selected-time");
      updateTotalPrice();
    }

    function updateSelectedDate() {
      selectedDateSpan.textContent = document.getElementById("date").value;
    }

    function updateTotalPrice() {
      const peopleCount = parseInt(peopleInput.value) || 1;
      totalPriceSpan.textContent = (basePrice * peopleCount).toLocaleString();
    }

    generateTimeSlots();
  </script>
</body>
</html>
