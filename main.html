<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스터디룸 예약 시스템</title>
    <link rel="stylesheet" href="styles.css">
    <!-- 폰트링크 -->
    <!-- content01 -->
    <link rel="stylesheet" href="assets/css/font_style.css">


    <style>
        body {
          font-family: sans-serif;
          font-size: 18px;
          line-height: 1.8;
          margin: 0;
          padding: 0;
        }
    
        /* 로그인 버튼 */
        .login-btn {
          position: fixed;
          top: 10px;
          right: 20px;
          font-size: 16px;
          text-decoration: none;
          color: #305070;
          background: none;
          border: none;
          z-index: 1001;
        }
    
        /* 헤더 전체 */
        header {
          background-color: #fff5eb;
          position: fixed;
          width: 100%;
          /*높이 설정*/
          top: 0;
          z-index: 1000;
          text-align: center;
          padding-top: 10px;
        }
    
        /* 로고 이미지 */
        .logo {
          width: 160px;
          height: auto;
          margin: 0 auto;
        }
    
        /* 네비게이션 바 */
        nav.navbar {
          background-color: #305070;
          color: #fff5eb;
          padding: 10px 0;
        }
    
        nav.navbar a {
          margin: 0 30px;
          text-decoration: none;
          font-weight: bold;
          color: #fff5eb;
        }
    
        /* 본문 */
        .container {
          max-width: 1000px;
          margin: 0 auto;
          padding: 40px 20px;
        }
    
        section h2 {
          font-size: 24px;
        }
    
        hr {
          margin: 12px 0;
        }
    
        /* 푸터 */
        footer {
          background-color: #f1f1f1;
          padding: 40px 20px;
          font-size: 16px;
        }
    
        footer .policy,
        footer .shopinfo {
          max-width: 1000px;
          margin: 0 auto;
        }
    
        footer .address {
          margin-top: 10px;
        }
    
        footer dl {
          margin: 10px 0;
        }

        main {
            padding-top: 120px;
        }
        /*메인 영역*/
        .main-first-visible {
            width: 100%;
            box-sizing: border-box;
            margin: 0 auto;
            height: 500px;
            position: relative;
            overflow: hidden;
        }

        
        
        .main-first-visible-bgd{
          position: absolute;
          width: 100%;
          height: 100%;
          background-color: blue;
          background-image: url("icon.png");
          background-repeat: no-repeat;
          background-position: center;
          background-size: 1000px 500px;
            


        }

        .main-introduce {
          display: flex;
          position: relative;
          width: 100%;
          height: 250px;
          align-items: center;
        }

        .main-introduce div {
          width: 100%;
          height: auto;
          margin: 0 auto;
          position:absolute;
          text-align: center;
          font-family: 'batang';
          font-weight: bold;
        }




        /*content1 area*/
        .content01 {
          display: block;
          position: relative;
          width: 100%;
          height: 900px;
          background-color: #fff5eb;
          font-family:'batang';

        }

        .content01 .explainarea {
          position: relative;
          width: 100%;
          height:250px;
          padding: 0 15px;
          box-sizing: border-box;
          line-height: 250px;
          text-align: center;
        }


        .content01 .showarea {
          display: block;
          position: relative;
          padding-top: 20px;
          width: 100%;
          height: 400px;
        }

  

        .content01 .show-box {
          display: block;
          position: absolute;
          width: 400px;
          height: 100%;
          left:50%;
          margin-left: -200px;
          /*background-color: aqua;*/
        }


        .content01 .button-area {
          float:left;
          width: 15%;
          height: 100%;
          /*background-color: red;*/

        }

        .content01 .showbutton-prev {
          position: absolute;
          width:60px;
          height:60px;
          top:50%;
          margin-top:-30px;
          border: 0;
          background-image:url("assets/icons/free-icon-back-button-7893865.png");
          background-repeat: no-repeat;
          background-size: 60px 60px;
        }

        .content01 .showslide-list {
          float: left;
          width: 70%;
          height: 100%;
        }

        .content01 .showslide-image {
          height: 65%;
          width: 100%;
          background-image: url("assets/images/room601.png");
          background-repeat: no-repeat;
          background-size: 100%;


        }

        .content01 .showslide-txt {
          height: 35%;
          width: 100%;
          margin: 5px;
          border: 0.5px solid black ;
          box-sizing: border-box;
         
        }



        .content01 .showbutton-next {
          position: absolute;
          width:60px;
          height:60px;
          top:50%;
          margin-top:-30px;
          background-image: url("assets/icons/free-icon-next-button-7893857.png");
          background-repeat: no-repeat;
          border: 0;
          background-size: 60px 60px;

        }




      </style>
</head>


<body>
       <!-- 로그인 버튼 -->
  <a class="login-btn" href="login.html">log in</a>

  <!-- 헤더 -->
  <header>
    <img class="logo" src="icon2.png" alt="icon">
    <nav class="navbar">
      <a href="#">홈</a>
      <a href="#">이용안내</a>
      <a href="#">고객지원</a>
      <a href="#">오시는길</a>
    </nav>
  </header>


    <!-- 메인 콘텐츠 영역 -->
    
    <main>
        <section class="main-first-visible">
          <div class="main-first-visible-bgd">
          </div>
        </section>
        <section class="main-introduce">
          <div>
              <h2 style="font-size: 1.8em;">모두를 위한, 모두의 공간</h2>
              <p style="font-size: 1.4em;">자유롭게, 편안하게</p>
          </div>
        </section>
        <section class="content01">
          <div class="explainarea">
            <p style="font-size: 1.5em;">
              그룹 스터디, 각종 회의를 위한 다양한 맞춤형 공간
            </p>
          </div>
          <div class="showarea">
          <div class="show-box">
            <div class="button-area">
              <button class="showbutton-prev"></button>
            </div>
            <div class="showslide-list drag">
              <div class="showslide-image">

              </div>
              <div class="showslide-txt">
                <p style="text-align: center;"><b>Room 603</b></p>
                <p>회의에 적합한 강의실</p>
              </div>
            </div>
            <div class="button-area">
              <button class="showbutton-next"></button>
            </div>
           </div>
          </div>
        </section>
        






        <!-- 각 페이지별 개별 콘텐츠가 들어가는 부분 -->
         <section class ="introduce-room">
            <div class="introduce-img">
        <!--화면 메인 이미지-->
        <figure>
            <img src="assets/images/Photo_style._A_clean,_well-lit,_and_spacious_study.jpg" 
            alt="스터디룸 메인 이미지">
            <figcaption>쾌적하고 조용한 공간에서 원하는 업무를 자유롭게</figcaption>
        </figure>
        </div>
        <div class="introduce-text">
            <h2>나는 스터디룸입니다</h2>
            <p>스터디룸이니까요</p>
        </div>
        <!--화면을 좌우로 스크롤 하며 간략하게 사용자가 룸 내부 모습을 알 수 있게 해주는 영역, 확정은 아님-->
        <div class="other_rooms">
            <div clsss="slice">
                <div class="slice1"><img></div>
                <div class="slice2"><img></div>
                <div class="slice3"><img></div>
                <div class="slice4"><img></div>
            </div>
        </div>
        </section>
        <!--공지사항 페이지에서 일부 데이터를 가져와 노출, more info는 더보기 링크로 공지사항 페이지로 연결됨-->
        <section class="announce">
            <h2>공지사항</h2>
            <div class ="link_support"><a href="support.html">more info</a></div>
            <ul>
                <li><a></a></li>
                <li><a></a></li>
                <li><a></a></li>
                <li><a></a></li>
            </ul>
        </section>
        <!--이벤트 페이지-->
        <section class="event">
            
        </section>


    </main>

     <!-- 푸터 영역 -->
        <footer>
            <div class="policy">
              <ul></ul>
              <p class="address">
                경기대 수원캠퍼스 웹프 스터디룸<br>
                사업자명 : <br>
                사업자등록번호 : <br>
                개인정보보호관리 : k<br>    
              </p>
            </div>
            <div class="shopinfo">
              <dl>
                <dt>모임공간 운영시간 :</dt>
                <dd><strong>365일 24시간</strong> 이용가능</dd>
              </dl>
              <dl>
                <dt>예약상담시간 :</dt>
                <dd>평일&amp;토요일 10시~22시 (일요일 10시~20시)</dd>
              </dl>
            </div>
          </footer>
    <script src="script.js"></script>
</body>
</html>
