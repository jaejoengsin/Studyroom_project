<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>웹프 스터디룸 로그인</title> 
    <!--css link -->
    <link rel="stylesheet" href="assets/css/bass.css" type="text/css">
    <link rel="stylesheet" href="assets/css/layout.css" type="text/css">
    <link rel="stylesheet" href="assets/css/components/comon.css" type="text/css">
    <link rel="stylesheet" href="assets/css/components/reservation.css" type="text/css">
    <link rel="stylesheet" href="assets/css/theme.css" type="text/css">
    <link rel="stylesheet" href="assets/css/login.css" type="text/css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

  <a class="login-btn" href="login.html">log in</a>

  <header>
      <div class="hamburger">
    <span></span>
    <span></span>
    <span></span>
  </div>
    <div class="logo">
      <img src="assets/images/icon2.png" alt="icon" id="logo">
   </div>    <nav class="navbar">
      <a href="main.html">홈</a>
      <a href="introduction.html">이용안내</a>
      <a href="service.html">고객지원</a>
      <a href="inform_rout.html">오시는길</a>
    </nav>
  </header>

  <main class="container">
    <div class="information-box">
      <h2>로그인</h2>
      <div class="section">
        <label for="username">아이디</label>
        <input type="text" id="username" name="username" placeholder="아이디를 입력하세요" required>
      </div>

      <div class="section">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
      </div>

      <div class="section">
        <button onclick="handleLogin()">로그인</button>
      </div>

      <div class="extra-links">
        <a href="find-id.html">아이디 찾기</a> |
        <a href="find-password.html">비밀번호 찾기</a> |
        <a href="signup.html">회원가입</a>
      </div>
    </div>
  </main>

  <footer>
    <div class="policy">
      <p class="address">
        스터디룸 : Insight Room<br>
        사업자명 : 최재정, 박예원<br>
        사업자등록번호 : 202015497-202311694<br>
      </p>
    </div>
    <div class="shopinfo">
      <dl>
        <dt>모임공간 운영시간 :</dt>
        <dd><strong>365일 24시간</strong> 이용가능</dd>
      </dl>
      <dl>
        <dt>예약상담시간 :</dt>
        <dd>평일&토요일 10시~22시 (일요일 10시~20시)</dd>
      </dl>
    </div>
  </footer>

  <script>
    // 테마 변경
    function updateTheme() {
      const now = new Date();
      const hour = now.getHours();
      const isDaytime = hour >= 6 && hour < 18;
      const logo = document.getElementById("logo");
      if (isDaytime) {
        document.body.classList.add('daytime');
        document.body.classList.remove('nighttime');
        logo.src = 'assets/images/icon2.png'; // 낮 로고
      } else {
        document.body.classList.add('nighttime');
        document.body.classList.remove('daytime');
        logo.src = 'assets/images/nighticon.png'; // 밤 로고
      }
    }

    updateTheme();
    setInterval(updateTheme, 60 * 60 * 1000); 


    updateTheme();
    setInterval(updateTheme, 60 * 60 * 1000);

    function handleLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!username || !password) {
        alert("아이디와 비밀번호를 모두 입력해주세요.");
        return;
      }

      alert(`${username}님 환영합니다!`);
      localStorage.setItem("isLoggedIn", "true"); // 로그인 상태 저장
      location.href = "main.html"; // 또는 원하는 페이지로 이동
    }

    // 한글 입력 방지
    document.getElementById("username").addEventListener("input", function () {
      this.value = this.value.replace(/[ㄱ-ㅎㅏ-ㅣ가-힣]/g, '');
    });

    document.addEventListener('DOMContentLoaded', () => {
      // 햄버거 메뉴 토글
      const hamburger = document.querySelector('.hamburger');
      const navbar = document.querySelector('nav.navbar');
  
      hamburger.addEventListener('click', () => {
        navbar.classList.toggle('active');
      });
    });

    
  </script>

</body>

</html>
