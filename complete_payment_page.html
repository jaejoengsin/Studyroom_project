<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결제완료</title>
  <!--css link -->
  <link rel="stylesheet" href="assets/css/bass.css" type="text/css">
  <link rel="stylesheet" href="assets/css/layout.css" type="text/css">
  <link rel="stylesheet" href="assets/css/components/comon.css" type="text/css">
  <link rel="stylesheet" href="assets/css/components/complete_payment.css" type="text/css">
  <link rel="stylesheet" href="assets/css/theme.css" type="text/css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="assets/scripts/hamburgerMenu.js"></script>
  <script src="assets/scripts/time_theme.js"></script>
</head>

<body>
  <!-- 로그인 버튼 -->
  <a id="loginBtn" class="login-btn" href="login.html">log in</a>

  <!-- 헤더 -->
  <header>

    <div class="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <div class="logo">
      <img src="assets/images/icon2.png" alt="icon" id="logo">
    </div>
    <nav class="navbar">
      <a href="main.html">홈</a>
      <a href="introduction.html">이용안내</a>
      <a href="service.html">고객지원</a>
      <a href="inform_rout.html">오시는길</a>
    </nav>
  </header>

  <main>
    <section class="information-box ">
      <h2>예약이 완료되었습니다!</h2>
      <div class="reservation-info">
        <ul>
          <li><span>예약자</span> <span id="name"></span></li>
          <li><span>연락처</span><span id="acount"></span></li>
          <li><span>이메일</span><span id="email"></span></li>
          <li><span>사용목적</span><span id="purpose"></span></li>
          <li><span>날짜</span><span id="date"></span></li>
          <li><span>시간</span><span id="time"></span></li>
          <li><span>방</span><span id="studyRoom"></span></li>
          <li><span>인원</span><span id="people"></span></li>
          <li><span>결제수단</span><span id="payment"></span></li>
          <li><span>금액</span><span id="totalPrice"></span></li>
        </ul>
      </div>
    </section>
  </main>

  <!-- 푸터 영역 -->
  <footer>
    <div class="policy">
      <ul></ul>
      <p class="address">
        경기대 수원캠퍼스 웹프 스터디룸<br>
        사업자명 : <br>
        사업자등록번호 : <br>
        개인정보보호관리 : k<br>
      </p>
    </div>
    <div class="shopinfo">
      <dl>
        <dt>모임공간 운영시간 :</dt>
        <dd><strong>365일 24시간</strong> 이용가능</dd>
      </dl>
      <dl>
        <dt>예약상담시간 :</dt>
        <dd>평일&amp;토요일 10시~22시 (일요일 10시~20시)</dd>
      </dl>
    </div>
  </footer>

  <script>

    document.addEventListener('DOMContentLoaded', () => {
      const loginBtn = document.getElementById('loginBtn');
      if (!loginBtn) return; // 로그인 버튼이 없는 페이지엔 실행 안함

      const isLoggedIn = localStorage.getItem('isLoggedIn');

      if (isLoggedIn === 'true') {
        loginBtn.textContent = 'log out';
        loginBtn.href = '#';
        loginBtn.style.cursor = 'pointer';

        // 기존에 이벤트 중복 방지 위해 먼저 이벤트 리스너 제거 후 추가 (optional)
        loginBtn.replaceWith(loginBtn.cloneNode(true));
        const newLoginBtn = document.getElementById('loginBtn') || document.querySelector('.login-btn');

        newLoginBtn.addEventListener('click', (e) => {
          e.preventDefault();
          localStorage.removeItem('isLoggedIn');
          alert('로그아웃 되었습니다.');
          location.reload(); // 새로고침하여 상태 갱신
        });
      } else {
        loginBtn.textContent = 'log in';
        loginBtn.href = 'login.html';
        loginBtn.style.cursor = 'pointer';
      }
    });

    window.onload = function () {
      const userDataStr = localStorage.getItem("userData");
      const useReserdataStr = localStorage.getItem("userReservationData");
      if (userDataStr != null && useReserdataStr != null) {
        const userData = JSON.parse(userDataStr);
        const useReserdata = JSON.parse(useReserdataStr);
        document.getElementById("name").textContent = userData["name"];
        document.getElementById("acount").textContent = userData["acount"];
        document.getElementById("email").textContent = userData["email"];
        document.getElementById("purpose").textContent = userData["purpose"];
        document.getElementById("payment").textContent = userData["payment"];
        document.getElementById("date").textContent = useReserdata["date"];
        document.getElementById("time").textContent = useReserdata["time"];
        document.getElementById("studyRoom").textContent = useReserdata["studyRoom"];
        document.getElementById("people").textContent = useReserdata["people"];
        document.getElementById("totalPrice").textContent = useReserdata["totalPrice"];
      }
      else {
        alert("질못된 페이지 로드입니다");
      }
    }

    // 페이지 로드 시 테마 적용
    updateTheme();

    // 1시간마다 테마 업데이트
    setInterval(updateTheme, 60 * 60 * 1000);

  </script>

</body>

</html>
